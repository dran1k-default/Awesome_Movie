<!DOCTYPE html>
<html>
<head>
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <style>body,html{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;}iframe{width:100%;height:100%;border:0;}</style>
</head>
<body>
    <iframe id="yt-player" allowfullscreen></iframe>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');
        if (videoId) {
            document.getElementById('yt-player').src = `https://youtube-nocookie.com{videoId}?enablejsapi=1&origin=` + window.location.origin;
        }
    </script>
</body>
</html>
